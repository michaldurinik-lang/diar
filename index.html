<script>
(function(){

  var auth=fb.auth(),fs=fb.firestore(),curUser=null;
  try{fs.enablePersistence({synchronizeTabs:true}).catch(function(){});}catch(e){}
  function getTok(){try{var o=JSON.parse(localStorage.getItem(TK)||'null');if(o&&o.exp>Date.now()+60000)return o.t;}catch(e){}return '';}

  var userP=new Promise(function(res){auth.onAuthStateChanged(function(u){curUser=u;res(u);});});
  function box(html){var d=document.createElement('div');d.id='gate';d.style.cssText='position:fixed;inset:0;z-index:999;display:grid;place-items:center;background:#121020;color:#EEEBFB;font:16px system-ui,sans-serif;padding:24px;text-align:center';d.innerHTML=html;document.body.appendChild(d);return d;}
  function showLogin(){ready(function(){if(document.getElementById('gate'))return;var d=box('<div style="max-width:340px"><div style="font:800 2rem system-ui;margin-bottom:8px">Můj diář</div><p style="color:#A09BC0;margin:0 0 20px">Přihlas se svým Google účtem. Tvoje data jsou jen tvoje a budou na všech zařízeních stejná.</p><button id="gIn" style="font:700 1rem system-ui;padding:14px 22px;border-radius:14px;border:0;background:#9084FF;color:#14112A;cursor:pointer">Přihlásit se přes Google</button></div>');d.querySelector('#gIn').onclick=signIn;});}
  function calBar(){ready(function(){if(getTok()||document.getElementById('calbar'))return;var b=document.createElement('div');b.id='calbar';b.style.cssText='position:fixed;left:0;right:0;top:0;z-index:90;background:#42340F;color:#F2B646;font:600 .85rem system-ui;padding:8px 12px;display:flex;gap:10px;align-items:center;justify-content:center;padding-top:calc(8px + env(safe-area-inset-top,0px))';b.innerHTML='<span>Google Kalendář je odpojený.</span><button style="font:700 .85rem system-ui;padding:6px 12px;border-radius:10px;border:0;background:#F2B646;color:#2a1f00;cursor:pointer">Připojit</button>';b.querySelector('button').onclick=signIn;document.body.appendChild(b);});}
  function gcal(tool,inp){
    var t=getTok();if(!t){calBar();var e=new Error('needs_reauth');e.code='needs_reauth';return Promise.reject(e);}
    var base='https://www.googleapis.com/calendar/v3/calendars/primary/events',h={Authorization:'Bearer '+t};
    function fail(r){var e=new Error('http '+r.status);e.code=(r.status===401?'needs_reauth':r.status===403?'forbidden':'tool_error');if(r.status===401){try{localStorage.removeItem(TK);}catch(x){}calBar();}return e;}
    if(tool==='list_events'){
      var q='?singleEvents=true&orderBy=startTime&maxResults='+(inp.pageSize||250)+'&timeMin='+encodeURIComponent(inp.startTime)+'&timeMax='+encodeURIComponent(inp.endTime)+'&timeZone='+encodeURIComponent(inp.timeZone||'Europe/Prague')+(inp.pageToken?'&pageToken='+encodeURIComponent(inp.pageToken):'');

      if(inp.allDay){b.start={date:inp.startTime.slice(0,10)};b.end={date:inp.endTime.slice(0,10)};}

    var r=new FileReader();r.onload=function(){try{var o=JSON.parse(r.result);var c=fs.collection('users/'+curUser.uid+'/d'),ps=[];Object.keys(o).forEach(function(k){if(KEYS_.indexOf(k)>=0)ps.push(c.doc(k).set({v:o[k]}));});Promise.all(ps).then(function(){alert('Záloha je načtená ('+ps.length+' částí). Stránka se obnoví.');location.reload();});}catch(e){alert('Soubor se nepodařilo přečíst.');}};r.readAsText(file);

<title>Můj diář</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: sidebar navigation on desktop, bottom tab bar on phones; one module per screen, cards on a soft lavender ground */
:root{
  --bg:#F4F2FA; --surface:#FFFFFF; --surface2:#ECE9F7; --ink:#1B1830; --muted:#625E7C; --line:#DFDAF0;
  --accent:#5545D6; --accent-ink:#FFFFFF; --accent-soft:#E6E2FB;
  --osobni:#D6406A; --osobni-soft:#FBE3EA; --prace:#13846C; --prace-soft:#D9F1EA;
  --hol:#C8372D; --blue:#2B7FD0; --warn:#B7790F; --warn-soft:#FBEFD2; --ok:#13846C;
  --shadow:0 1px 2px rgba(40,30,90,.06),0 6px 18px rgba(40,30,90,.06);
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121020; --surface:#1C1932; --surface2:#262244; --ink:#EEEBFB; --muted:#A09BC0; --line:#322D55;
  --accent:#9084FF; --accent-ink:#14112A; --accent-soft:#2E2961;
  --osobni:#F27B9D; --osobni-soft:#4A2336; --prace:#4CCBA8; --prace-soft:#173B34;
  --hol:#FF8A80; --blue:#6FB0F0; --warn:#F2B646; --warn-soft:#42340F; --ok:#4CCBA8;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.28); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121020; --surface:#1C1932; --surface2:#262244; --ink:#EEEBFB; --muted:#A09BC0; --line:#322D55;
  --accent:#9084FF; --accent-ink:#14112A; --accent-soft:#2E2961;
  --osobni:#F27B9D; --osobni-soft:#4A2336; --prace:#4CCBA8; --prace-soft:#173B34;
  --hol:#FF8A80; --blue:#6FB0F0; --warn:#F2B646; --warn-soft:#42340F; --ok:#4CCBA8;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.28); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.9rem;font-weight:800}
h2{font-size:1.15rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.tnum{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:230px minmax(0,1fr);height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:18px;overflow:auto}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.35rem;padding:0 8px;display:flex;align-items:center;gap:10px}
.brand i{width:30px;height:30px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;padding:10px 12px;border:0;background:none;border-radius:10px;cursor:pointer;text-align:left;font-weight:600;color:var(--muted)}
.nav button:hover{background:var(--surface2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav svg,.tabbar svg{width:20px;height:20px;flex:none}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:7px 4px;border-radius:8px;cursor:pointer;font-size:.84rem;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.status{font-size:.78rem;color:var(--muted);display:flex;gap:6px;align-items:center;padding:0 4px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.dot.off{background:var(--warn)}
.themebtn{border:1px solid var(--line);background:none;border-radius:10px;padding:8px;cursor:pointer;font-weight:600;color:var(--muted)}

.main{overflow:auto;padding:26px clamp(16px,3vw,36px) 40px}
.topbar{display:none}
.page{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.head{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:end;justify-content:space-between}
.head p{margin:4px 0 0}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card>h2,.card>.ch{margin-bottom:12px}
.ch{display:flex;justify-content:space-between;align-items:center;gap:8px}
.banner{background:var(--warn-soft);border:1px solid var(--warn);border-radius:12px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;font-size:.9rem}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 10px;font-size:.84rem}
.ibtn{border:0;background:none;cursor:pointer;color:var(--muted);padding:4px 6px;border-radius:8px;line-height:1}
.ibtn:hover{background:var(--surface2);color:var(--hol)}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0;width:100%}
textarea{resize:vertical;min-height:90px}
.form{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.form .grow{flex:1 1 180px}
.form select,.form input[type=date],.form input[type=time],.form input[type=number]{width:auto;flex:0 1 auto}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;cursor:pointer;font-size:.86rem;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pill{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px;letter-spacing:.02em;white-space:nowrap}
.pill.osobni{background:var(--osobni-soft);color:var(--osobni)}
.pill.prace{background:var(--prace-soft);color:var(--prace)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.hol{background:var(--osobni-soft);color:var(--hol)}

.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;padding:9px 2px;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row .t{flex:1 1 9em;min-width:min(9em,100%);overflow-wrap:break-word}
.row .t.done{text-decoration:line-through;color:var(--muted)}
.row .acts{display:flex;align-items:center;gap:6px;margin-left:auto;flex:none}
.row .when{font-size:.82rem;color:var(--muted);white-space:nowrap}
.row .when.late{color:var(--hol);font-weight:700}
.chk{appearance:none;width:20px;height:20px;border:2px solid var(--muted);border-radius:6px;display:grid;place-items:center;cursor:pointer;flex:none;margin:0;background:var(--surface)}
.chk:checked{background:var(--accent);border-color:var(--accent)}
.chk:checked::after{content:"";width:9px;height:5px;border:2px solid var(--accent-ink);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.empty{padding:18px 4px;color:var(--muted);text-align:center;font-size:.92rem}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dw{font-size:.74rem;font-weight:700;color:var(--muted);text-align:center;padding:4px 0;text-transform:uppercase;letter-spacing:.06em}
.day{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-height:76px;padding:5px 6px;display:flex;flex-direction:column;gap:2px;cursor:pointer;text-align:left;min-width:0;overflow:hidden}
.day:hover{border-color:var(--accent)}
.day.out{opacity:.45}
.day.we .n{color:var(--muted)}
.day.hol .n{color:var(--hol)}
.day.today{background:var(--accent-soft);border-color:var(--accent)}
.day.sel{outline:2px solid var(--accent);outline-offset:-1px}
.day .n{font-weight:700;font-size:.92rem}
.day .nm{font-size:.68rem;color:var(--muted);line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day .ev{display:flex;gap:3px;flex-wrap:wrap;margin-top:auto}
.day .ev i{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.day .ev i.osobni{background:var(--osobni)}.day .ev i.prace{background:var(--prace)}
.mnav{display:flex;align-items:center;gap:8px}
.mnav strong{font-family:var(--f-display);font-size:1.15rem;min-width:9.5em;text-align:center}

.sect{font-size:.74rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:12px 0 2px}
.sect:first-child{margin-top:0}
.bar{height:10px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.g>i{background:var(--prace)}
.days{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.dcard.today{border-color:var(--accent);background:var(--accent-soft)}
.dcard h3{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.dcard label{font-size:.7rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:flex;flex-direction:column;gap:2px}
.dcard label input{text-transform:none;letter-spacing:0;font-weight:400;font-size:.9rem;padding:7px 9px}
.hab{display:grid;grid-template-columns:minmax(90px,1.4fr) repeat(7,minmax(30px,1fr)) 36px;gap:6px;align-items:center;min-width:0}
.hab .h{font-size:.72rem;font-weight:700;color:var(--muted);text-align:center;text-transform:uppercase}
.hab .name{font-weight:600;overflow-wrap:anywhere}
.hb{width:100%;max-width:34px;aspect-ratio:1;border-radius:50%;border:2px solid var(--line);background:var(--surface);cursor:pointer;justify-self:center;padding:0}
.hb[aria-pressed="true"]{background:var(--prace);border-color:var(--prace)}
.hb.td{border-color:var(--accent)}
.note{display:flex;flex-direction:column;gap:6px}
.note input.nt{font-weight:700;border-color:transparent;padding-left:4px;background:none}
.note textarea{border-color:transparent;background:var(--surface2);min-height:110px}
.note .ft{display:flex;justify-content:space-between;align-items:center}
.sum{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.sum .card b{font-family:var(--f-display);font-size:1.5rem;display:block}
.pos{color:var(--ok)}.neg{color:var(--hol)}
.cat{display:grid;grid-template-columns:100px 1fr auto;gap:10px;align-items:center;padding:5px 0;font-size:.9rem}
.sched{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr))}
.blk{border-radius:10px;padding:8px 10px;background:var(--surface2);border-left:4px solid var(--accent);display:flex;justify-content:space-between;gap:6px;align-items:flex-start}
.blk.osobni{border-color:var(--osobni)}.blk.prace{border-color:var(--prace)}
.blk b{display:block;overflow-wrap:anywhere}
.more{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.more button{display:flex;flex-direction:column;gap:8px;align-items:flex-start;padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;box-shadow:var(--shadow)}
.more svg{width:24px;height:24px;color:var(--accent)}

var db=null,col=null,pend={},timers={},chain={},syncState='local',ready=false;
function setStatus(){
  var el=document.getElementById('status');if(!el)return;
  var map={sync:['Synchronizováno mezi zařízeními',''],local:['Uloženo jen v tomto zařízení','off'],err:['Ukládání se nepovedlo, zkusím znovu','off'],load:['Načítám…','off']};
  var m=map[syncState]||map.load;el.innerHTML='<span class="dot '+m[1]+'"></span><span>'+m[0]+'</span>';
}
function save(k){
  lsSet(k,S[k]);
  if(!col){return;}
  pend[k]=(pend[k]||0)+1;
  clearTimeout(timers[k]);
  timers[k]=setTimeout(function(){
    chain[k]=(chain[k]||Promise.resolve()).then(function(){return col.doc(k).set({v:JSON.parse(JSON.stringify(S[k]))});}).then(function(){syncState='sync';setStatus();},function(){syncState='err';setStatus();}).then(function(){pend[k]=Math.max(0,(pend[k]||1)-1);});
  },350);
}
function typing(){var a=document.activeElement;return a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&document.getElementById('main').contains(a);}
var dirtyRender=false;
function connect(){
  var cl=window.claude;
  if(!cl||!cl.use){startLocal();return;}
  Promise.all([cl.use('db'),cl.use('user')]).then(function(r){
    db=r[0];var u=r[1];
    if(!db||!u){startLocal();return;}
    return u.id().then(function(id){
      if(!id){db=null;startLocal();return;}
      col=db.collection('data/users/'+id);
      var first=true;
      col.onSnapshot(function(snap){
        var present={};
        snap.docs.forEach(function(d){
          present[d.id]=1;
          if(KEYS.indexOf(d.id)<0||pend[d.id]>0||d.metadata.hasPendingWrites)return;
          var b=d.data();if(!b||b.v==null)return;
          S[d.id]=JSON.parse(JSON.stringify(b.v));lsSet(d.id,S[d.id]);hasLS[d.id]=true;
        });
        if(first){
          first=false;
          KEYS.forEach(function(k){if(!present[k]){if(!hasLS[k]){S[k]=seed(k);hasLS[k]=true;}save(k);}});
          mergeShifts();
        }
        syncState='sync';ready=true;setStatus();
        if(typing()){dirtyRender=true;}else{render();}
      },function(){syncState='local';setStatus();startLocal(true);});
    });
  }).catch(function(){startLocal();});
}
function startLocal(again){
  if(!again){KEYS.forEach(function(k){if(!hasLS[k]){S[k]=seed(k);hasLS[k]=true;lsSet(k,S[k]);}});mergeShifts();}
  col=null;syncState='local';ready=true;setStatus();render();
}

function loadGoogle(f,t,force){

  cl.use('mcp').then(function(m){
    if(!m){G.state='none';G.fail=true;return;}
    var all=[];
    function page(tok,n){
      var inp={startTime:zIso(f,0),endTime:zIso(t,1),orderBy:'startTime',pageSize:250,timeZone:'Europe/Prague'};

        p=p||{};

      });
    }

      G.by={};
      all.forEach(function(e){

  var up=all.filter(function(e){return e.date>=TODAY;}),past=all.filter(function(e){return e.date<TODAY;}).slice(-5).reverse();
  var mo=all.filter(function(e){return e.date.slice(0,7)===TODAY.slice(0,7)&&e.date<=TODAY;}).length;
  var row=function(e){return '<li class="row"><span class="when tnum" style="min-width:6.4em">'+DOW[dowOf(e.date)]+' '+shortDate(e.date)+'</span><span class="when tnum">'+evTimeLabel(e)+'</span>'+dotOf(e)+'<span class="t">'+esc(e.title)+'</span><span class="acts">'+(e.g==='ok'?'<span class="pill g">Google</span>':'')+(e.ser?'<button class="btn sm" data-act="evDelSer" data-id="'+e.id+'">Celá řada</button>':'')+'<button class="ibtn" data-act="evDel" data-id="'+e.id+'" aria-label="Smazat trénink">'+icon('x').replace('<svg','<svg width="16" height="16"')+'</button></span></li>';};
  var r='<div class="page">'+head('Cvičení','Tréninky se samy zapíšou do Kalendáře i Diáře','<span class="pill g">Tento měsíc: '+mo+' tréninků</span>');
  r+='<div class="card"><form class="form" data-form="addTrain"><input type="date" id="trD" value="'+TODAY+'" aria-label="Datum" required>'+timeInput('trF','18:00','Od')+''+timeInput('trT','19:00','Do')+'<select id="trY" aria-label="Druh">'+TRTYPES.map(function(x){return '<option>'+x+'</option>';}).join('')+'</select><input class="grow" type="text" id="trN" placeholder="Poznámka, například nohy, 5 km" aria-label="Poznámka">'+swatchFields('trC')+repFields('tr')+'<label class="small muted" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="trG" checked> Zapsat do Google Kalendáře a upozornit</label><button class="btn pri" type="submit">Přidat trénink</button></form>'+(UI.trMsg?'<div class="small muted" style="margin-top:8px">'+esc(UI.trMsg)+'</div>':'')+'</div>';

function viewSched(){

  r+='<div class="sched">'+DOWL.map(function(dn,i){

  var cats=Object.keys(by).sort(function(a,b){return by[b]-by[a];});var max=cats.length?by[cats[0]]:1;

  r+='<div class="grid"><section class="card"><h2>Výdaje podle kategorií</h2>'+(cats.length?cats.map(function(c){return '<div class="cat"><span>'+esc(c)+'</span><div class="bar"><i style="width:'+Math.round(by[c]/max*100)+'%"></i></div><span class="tnum">'+money(by[c])+'</span></div>';}).join(''):emptyMsg('Tento měsíc zatím žádné výdaje.'))+'</section>';

  return r;

function scopeHtml(){
  return [['all','Vše'],['osobni','Osobní'],['prace','Práce']].map(function(s){return '<button type="button" data-act="scope" data-s="'+s[0]+'" aria-pressed="'+(UI.scope===s[0])+'">'+s[1]+'</button>';}).join('');
}
function renderChrome(){
  document.getElementById('nav').innerHTML=TABS.map(function(t){return '<button type="button" data-act="goto" data-tab="'+t[0]+'"'+(UI.tab===t[0]?' aria-current="page"':'')+'>'+icon(t[2])+t[1]+'</button>';}).join('');
  document.getElementById('tabbar').innerHTML=MOBILE.map(function(k){var t=TABS.filter(function(x){return x[0]===k;})[0];var cur=UI.tab===k;return '<button type="button" data-act="goto" data-tab="'+t[0]+'"'+(cur?' aria-current="page"':'')+' aria-label="'+t[1]+'">'+icon(t[2])+'<span>'+(SHORT[k]||t[1])+'</span></button>';}).join('');
  document.getElementById('scopeTop').innerHTML=scopeHtml();
  document.getElementById('scopeSide').innerHTML=scopeHtml();
}
function render(){
  dirtyRender=false;
  renderChrome();
  var main=document.getElementById('main');
  var v=(VIEWS[UI.tab]||viewHome)();
  var banner=hasExamples()&&ready?'<div class="page" style="margin-bottom:16px"><div class="banner"><span>V diáři jsou ukázková data, ať vidíš, jak vypadá. Své věci přidávej klidně hned.</span><button class="btn sm" data-act="clearEx">Smazat ukázky</button></div></div>':'';
  var un=(!hasExamples()&&ready)?unsentEv().length:0;if(un)banner+='<div class="page" style="margin-bottom:16px"><div class="banner"><span>'+(UI.bf?UI.bfMsg:un+' '+(un===1?'událost není':un<5?'události nejsou':'událostí není')+' v Google Kalendáři (od dneška dál).')+'</span>'+(UI.bf?'':'<button class="btn sm pri" data-act="bfAll">Zapsat do Googlu</button>')+'</div></div>';
  main.innerHTML=banner+v+(UI.dayOpen?dayModal():'')+(UI.toast?'<div class="toast" role="status">'+esc(UI.toast)+'</div>':'');

  var spr=document.querySelector('.spread');if(spr&&UI.pgi&&spr.clientWidth)spr.scrollLeft=spr.clientWidth;
  ensureGoogle();
}

function timeInput(id,v,label){
  v=normTime(v);var h=v?v.slice(0,2):'',m=v?v.slice(3,5):'00';
  var ho='<option value="">--</option>',mo='';
  for(var i=0;i<24;i++){var s=p2(i);ho+='<option value="'+s+'"'+(s===h?' selected':'')+'>'+s+'</option>';}
  var ms=[];for(var j=0;j<60;j+=5)ms.push(p2(j));if(ms.indexOf(m)<0){ms.push(m);ms.sort();}
  ms.forEach(function(s){mo+='<option value="'+s+'"'+(s===m?' selected':'')+'>'+s+'</option>';});
  return '<span class="tp"><select class="tps" data-p="h" aria-label="'+label+', hodina">'+ho+'</select><b>:</b><select class="tps" data-p="m" aria-label="'+label+', minuta">'+mo+'</select><input type="hidden" id="'+id+'" value="'+v+'"></span>';
}
function setTime(id,v){
  var f=document.getElementById(id);if(!f)return;f.value=v;
  var w=f.parentNode;if(!w||!w.querySelector)return;
  var h=w.querySelector('[data-p="h"]'),m=w.querySelector('[data-p="m"]');
  if(h)h.value=v?v.slice(0,2):'';if(m&&v){var mm=v.slice(3,5);if(!m.querySelector('option[value="'+mm+'"]')){var o=document.createElement('option');o.value=mm;o.textContent=mm;m.appendChild(o);}m.value=mm;}
}
function normTime(s){
  s=String(s||'').toLowerCase().replace(/hod\.?|h/g,'').replace(/[.,\s]+/g,':').replace(/^:+|:+$/g,'');
  var h,m,x;
  if((x=s.match(/^(\d{1,2})$/))){h=+x[1];m=0;}
  else if((x=s.match(/^(\d{1,2}):(\d{1,2})$/))){h=+x[1];m=+x[2];}
  else if((x=s.match(/^(\d{1,2})(\d{2})$/))){h=+x[1];m=+x[2];}
  else return '';
  if(h>23||m>59)return '';
  return p2(h)+':'+p2(m);
}

  addTask:function(){var t=val('tkT');if(!t)return;var due=val('tkD'),tm=val('tkH'),gs=chk('tkG');if(tm&&!due)due=TODAY;var o={id:uid(),title:t,due:due,done:false,scope:val('tkS'),color:colVal('tkC')};if(tm){o.time=tm;o.date=due;}S.tasks.push(o);save('tasks');render();if(tm&&gs)gSendAll([o]);},
  addShop:function(){var t=val('spN');if(!t)return;S.shop.push({id:uid(),name:t,sec:val('spS'),done:false});save('shop');render();},
  addHabit:function(){var t=val('hbN');if(!t)return;S.habits.list.push({id:uid(),name:t});save('habits');render();},
  addGoal:function(){var t=val('glT');if(!t)return;S.goals.push({id:uid(),title:t,steps:[]});save('goals');render();},
  addStep:function(f){var t=f.elements.s.value.trim();if(!t)return;var g=S.goals.filter(function(x){return x.id===f.dataset.id;})[0];if(g){g.steps.push({t:t,d:false});save('goals');render();}},
  addNote:function(){var t=val('ntT');if(!t)return;S.notes.push({id:uid(),title:t,text:'',scope:val('ntS'),pin:false,at:TODAY});save('notes');render();},
  addBlock:function(){var t=val('bkN');if(!t)return;S.sched.push({id:uid(),day:+val('bkD'),from:val('bkF')||'09:00',to:val('bkT')||'10:00',title:t,scope:val('bkS')});save('sched');render();},
  addFin:function(){var a=parseFloat(val('fnA'));if(!(a>0))return;S.fin.push({id:uid(),date:val('fnD')||TODAY,type:val('fnY'),amount:a,cat:val('fnC'),note:val('fnN'),scope:val('fnS')});save('fin');render();}
};

function pgMark(){var b=document.querySelectorAll('.pgdots button');for(var i=0;i<b.length;i++)b[i].classList.toggle('on',i===(UI.pgi?1:0));}
document.addEventListener('scroll',function(e){var sp=e.target;if(sp&&sp.classList&&sp.classList.contains('spread')&&sp.clientWidth){var i=sp.scrollLeft>sp.clientWidth/2?1:0;if(i!==UI.pgi){UI.pgi=i;pgMark();}}},true);
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&UI.dayOpen){UI.dayOpen=false;render();}});
document.addEventListener('click',function(e){var el=e.target.closest('[data-act]');if(el&&A[el.dataset.act]){A[el.dataset.act](el);}});
document.addEventListener('change',function(e){var tp=e.target;if(tp&&tp.classList&&tp.classList.contains('tps')){var w=tp.parentNode,hid=w.querySelector('input[type="hidden"]'),hh=w.querySelector('[data-p="h"]').value,mm=w.querySelector('[data-p="m"]').value;hid.value=hh===''?'':hh+':'+(mm||'00');}var tm=e.target;if(tm&&tm.classList&&tm.classList.contains('tm')){var nv=normTime(tm.value);if(nv||!tm.value.trim()){tm.value=nv;tm.classList.remove('bad');}else tm.classList.add('bad');}var el=e.target.closest('[data-change]');if(el&&C[el.dataset.change]){C[el.dataset.change](el);}if(dirtyRender&&!typing())render();});
document.addEventListener('submit',function(e){var f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();if(F[f.dataset.form])F[f.dataset.form](f);});
document.addEventListener('input',function(e){if(e.target.id==='noteQ'){UI.noteQ=e.target.value;var l=document.getElementById('noteList');if(l)l.innerHTML=noteCards();}});
document.addEventListener('focusout',function(){setTimeout(function(){if(dirtyRender&&!typing())render();},60);});

/* theme toggle: follows the phone setting until the viewer picks */
document.getElementById('themeBtn').addEventListener('click',function(){
  var r=document.documentElement;var cur=r.getAttribute('data-theme');
  var dark=cur?cur==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches;
  var next=dark?'light':'dark';r.setAttribute('data-theme',next);try{localStorage.setItem('diar.theme',next);}catch(e){}
});
try{var th=localStorage.getItem('diar.theme');if(th)document.documentElement.setAttribute('data-theme',th);}catch(e){}

document.getElementById('brandIcon').innerHTML=bi;document.getElementById('brandIcon2').innerHTML=bi;

setInterval(function(){var n=iso(new Date());if(n!==TODAY){TODAY=n;if(!typing())render();}},60000);

setStatus();render();connect();
